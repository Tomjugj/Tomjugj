const NAV=[['home','总览'],['map','知识地图'],['modules','领域导读'],['plan','8周路线'],['resources','资源库'],['progress','学习进度']];
const KEY='knowledge-atlas-progress-v1';let state={view:'home',domain:null,done:{},weeks:{},notes:{},search:''};
try{let s=JSON.parse(localStorage.getItem(KEY)||'{}');if(s&&typeof s==='object'){state.done=s.done&&typeof s.done==='object'?s.done:{};state.weeks=s.weeks&&typeof s.weeks==='object'?s.weeks:{};state.notes=s.notes&&typeof s.notes==='object'?s.notes:{}}}catch(e){}
const id=(d,i)=>d+'-'+i;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const doneCount=()=>DOMAIN.reduce((a,d)=>a+d.lessons.filter((l,i)=>state.done[id(d.id,i)]).length,0);const allCount=DOMAIN.reduce((a,d)=>a+d.lessons.length,0);const totalWeeks=()=>PLAN.filter((w,i)=>state.weeks[i]).length;const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify({done:state.done,weeks:state.weeks,notes:state.notes}))}catch(e){alert('浏览器存储失败。建议导出进度备份。')}};function navigate(v,d=null){state.view=v;state.domain=d;state.search='';render();window.scrollTo({top:0,behavior:'instant'})}function navHtml(){document.querySelector('#nav').innerHTML=NAV.map(([k,n])=>`<button class="${state.view===k?'active':''}" data-nav="${k}">${n}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));}
function header(k,title,desc){return `<div class="hero"><div class="kicker">${k}</div><h1 class="title">${title}</h1><p class="lead">${desc}</p></div>`}function domainCard(d){let n=d.lessons.filter((x,i)=>state.done[id(d.id,i)]).length;return `<button class="card" data-domain="${d.id}"><span class="symbol">${d.symbol}</span><h3>${d.name} <span class="sub">${d.en}</span></h3><p>${d.caption}<br>${d.question}</p><div class="progress"><div class="bar" style="width:${n/d.lessons.length*100}%"></div></div><span class="sub">${n}/${d.lessons.length} 节</span></button>`}function bindDomains(){document.querySelectorAll('[data-domain]').forEach(b=>b.onclick=()=>navigate('modules',b.dataset.domain))}function mapHtml(){return `<div class="map"><div class="map-center">哲学 · 检验知识与价值的基本假设</div><div class="map-arrow">↓　↕　↓</div><div class="map-row"><div class="map-node"><b>历史</b><span>事件如何演化</span></div><div class="map-node"><b>社会</b><span>制度如何运行</span></div></div><div class="map-arrow">↓　↕　↓</div><div class="map-row"><div class="map-node"><b>艺术</b><span>意义如何表达</span></div><div class="map-node"><b>科幻</b><span>假设如何测试</span></div></div></div>`}function nextLesson(){for(const d of DOMAIN){for(let i=0;i<d.lessons.length;i++)if(!state.done[id(d.id,i)])return {d,i}}return null}
function home(){let n=nextLesson();return header('LEARN THE WORLD · NOT JUST THE FACTS','一张地图，理解人类世界','为理工科读者设计的高密度通识学习系统：先建立框架，再通过思想实验、历史机制与关键问题深入。无需注册，可以随时继续。')+`<div class="stats"><div class="stat"><strong>${doneCount()}/${allCount()}</strong><span>已完成知识单元</span></div><div class="stat"><strong>${totalWeeks()}/8</strong><span>学习路线进度</span></div><div class="stat"><strong>5</strong><span>核心知识领域</span></div></div><div class="section-header"><h2>从这里开始</h2><button class="btn primary" id="continue">${n?'继续学习 →':'已完成全部单元 ✓'}</button></div><div class="grid">${DOMAIN.map(domainCard).join('')}</div><div class="section-header"><h2>一个能反复使用的认知框架</h2></div><div class="paper">${mapHtml()}<p class="muted tiny">地图表达学习组织方式，不意味着五个学科具有严格上下级关系。</p></div><div class="paper"><h3>如何使用本站？</h3><p><b>① 读地图：</b>先知道一门学科关心什么；<b>② 读短文：</b>每节约3—5分钟；<b>③ 做思想实验：</b>用一个问题检验理解；<b>④ 查资源：</b>遇到兴趣点再读原著或公开课。</p><p class="muted tiny">建议每天20—30分钟，每周学习3—5个单元。不追求打卡数量，建议边学边找反例。</p></div>`}
function mapPage(){return header('THE BIG PICTURE','跨学科知识地图','不是把学科当作相互独立的百科，而是围绕共同问题组织不同解释。')+`<div class="paper">${mapHtml()}</div><div class="section-header"><h2>共同问题：现代社会如何形成？</h2></div><div class="grid">${[['历史','工业化、殖民、国家形成'],['哲学','理性、自由、正当性'],['社会','资本主义、科层制、阶层'],['艺术','透视、摄影、现代主义'],['科幻','技术控制、社会未来']].map(([a,b])=>`<div class="card"><h3>${a}</h3><p>${b}</p></div>`).join('')}</div><div class="paper"><h3>四条学习规则</h3><p><b>事实 ≠ 因果解释 ≠ 价值判断。</b>先辨认作者正在做哪件事。</p><p><b>时间顺序不等于因果。</b>“在此之后”不一定是“因为此事”。</p><p><b>模型不等于现实。</b>注意适用范围、假设和反例。</p><p><b>跨学科不是混淆学科。</b>一个社会问题可能需要历史、制度和伦理的不同证据。</p></div>`}
function modulePage(){if(!state.domain)return header('MODULAR LEARNING','五个领域，25个短单元','每节围绕一个关键问题：核心模型、容易犯的错误、跨学科连接、延伸资源。')+`<div class="grid">${DOMAIN.map(domainCard).join('')}</div>`;let d=DOMAIN.find(x=>x.id===state.domain)||DOMAIN[0];let n=d.lessons.filter((x,i)=>state.done[id(d.id,i)]).length;return `<div class="hero"><div class="kicker"><button class="btn" id="back" style="padding:4px 9px">← 领域列表</button>　${d.en.toUpperCase()}</div><h1 class="title">${d.symbol} ${d.name}</h1><p class="lead">${d.intro}</p><div class="concepts">${d.concepts.map(c=>`<span class="concept">${c}</span>`).join('')}</div><p class="muted tiny">进度 ${n}/${d.lessons.length} · 打开概念细节，不需要先掌握术语。</p></div><div class="layout-two"><div class="paper" style="margin-top:0">${d.lessons.map((l,i)=>`<article class="lesson" id="lesson-${i}"><div class="num">UNIT ${String(i+1).padStart(2,'0')}</div><h3>${esc(l.t)}</h3><p class="q">${esc(l.q)}</p><p>${esc(l.model)}</p><details><summary>常见误区与跨领域联系</summary><p><b>注意：</b>${esc(l.mis)}</p><p><b>跨领域：</b>${esc(l.cross)}</p></details><div class="cross"><b>思考题：</b>${esc(l.think)}</div><p class="tiny muted">延伸：${l.links.map(k=>{let r=RESOURCES.find(x=>x.id===k);return `<a href="${r.url}" target="_blank" rel="noopener noreferrer">${esc(r.name)} ↗</a>`}).join(' · ')}</p><label class="tiny" style="display:block;margin:12px 0 5px" for="note-${i}">我的思考（自动保存在本机）</label><textarea id="note-${i}" data-note="${id(d.id,i)}" placeholder="新观点、证据、反例或问题…" rows="2" style="width:100%;resize:vertical;border:1px solid var(--line);padding:10px;border-radius:9px;font:inherit">${esc(state.notes[id(d.id,i)]||'')}</textarea><div style="margin-top:12px"><button class="${state.done[id(d.id,i)]?'done':'notdone'}" data-lesson="${id(d.id,i)}">${state.done[id(d.id,i)]?'✓ 已完成 · 点击取消':'○ 标记已理解'}</button></div></article>`).join('')}</div><div class="paper sidebox" style="margin-top:0"><h3>本章导航</h3>${d.lessons.map((l,i)=>`<p class="tiny"><a href="#lesson-${i}">${state.done[id(d.id,i)]?'✓':'○'} ${esc(l.t)}</a></p>`).join('')}<div class="progress"><div class="bar" style="width:${n/d.lessons.length*100}%"></div></div><p class="tiny muted">完成不意味着掌握全部争议，建议尝试回答每节的思考题。</p></div></div>`}
function planPage(){return header('A GENTLE START','8周阅读重启路径','每天20—30分钟，每周5天。目标是建立稳定的理解框架，而不是强迫自己读完大部头。')+`<div class="paper"><div class="progress"><div class="bar" style="width:${totalWeeks()/8*100}%"></div></div><p class="muted tiny">已完成 ${totalWeeks()} / 8 周。可以跳周学习，也可以随时调整顺序。</p>${PLAN.map((w,i)=>`<div class="week"><span class="pill">第${i+1}周</span><div><h3>${w[0]}</h3><p>任务：${w[1]}</p><p>产出：${w[2]}</p></div><label title="标记本周完成"><input class="check" type="checkbox" data-week="${i}" ${state.weeks[i]?'checked':''} aria-label="完成第${i+1}周"></label></div>`).join('')}</div><div class="alert">有一周没有完成也没有关系。进度是帮助恢复学习的工具，不是评价学习者的指标。</div>`}
function resourcePage(){let q=state.search.toLowerCase();let rs=RESOURCES.filter(r=>`${r.name} ${r.for} ${r.type} ${r.desc}`.toLowerCase().includes(q));return header('CURATED RESOURCES','少而精的外部资源库','本站提供第一层精炼理解；只有当你想验证、深入或看原始材料时，才需要打开外部链接。')+`<input id="search" class="search" type="search" value="${esc(state.search)}" placeholder="搜索：哲学 / 历史 / 数据 / 课程 …" aria-label="搜索资源"><div class="paper" id="results">${rs.map(resourceHtml).join('')||'<div class="empty">没有匹配的资源</div>'}</div><p class="muted tiny">资源主要来自开放百科、大学公开课、公开教材及非营利教育项目；多数为英文。纸质中文读物建议：《你的第一本哲学书》《世界小史》《艺术的故事》《社会学的想象力》，科幻选读特德·姜；这些书通常不免费，不提供未经授权的全文。</p>`}
function resourceHtml(r){return `<div class="resource"><div><a href="${r.url}" target="_blank" rel="noopener noreferrer">${esc(r.name)} ↗</a><small>${esc(r.desc)}</small><div class="meta"><span class="tag">${esc(r.for)}</span><span class="tag">${esc(r.type)}</span><span class="tag">${esc(r.lang)}</span></div></div></div>`}
function progressPage(){const completed=DOMAIN.flatMap(d=>d.lessons.map((l,i)=>({d,l,i}))).filter(x=>state.done[id(x.d.id,x.i)]);return header('YOUR OWN PACE','学习进度与备份','所有阅读进度和思考笔记只存在当前浏览器，不上传服务器。请定期导出备份；更换设备、清理浏览器数据或使用隐私模式可能导致进度丢失。')+`<div class="stats"><div class="stat"><strong>${doneCount()}/${allCount()}</strong><span>已理解单元</span></div><div class="stat"><strong>${totalWeeks()}/8</strong><span>路线完成周数</span></div><div class="stat"><strong>${Object.values(state.notes).filter(x=>x.trim()).length}</strong><span>有笔记的单元</span></div></div><div class="section-header"><h2>分领域进度</h2></div><div class="grid">${DOMAIN.map(domainCard).join('')}</div><div class="paper"><h3>备份 / 恢复</h3><p class="muted tiny">导出 JSON 文件，之后可以在另一台设备的本站导入。导入会替换本地现有记录。JSON 文件包含你写的笔记，请妥善保管。</p><div class="actions"><button class="btn primary" id="export">↓ 导出学习数据</button><label class="btn" for="import" style="cursor:pointer">↑ 导入备份</label><input id="import" type="file" accept="application/json,.json" class="hide"><button class="btn" id="reset">清空本机进度</button></div></div><div class="paper"><h3>已完成知识单元</h3>${completed.length?completed.map(({d,l})=>`<p>✓ ${d.name} / ${esc(l.t)}</p>`).join(''):'<p class="muted">还没有完成的单元。从任意领域开始即可。</p>'}</div>`}
function bind(){navHtml();bindDomains();let c=document.querySelector('#continue');if(c)c.onclick=()=>{let n=nextLesson();if(n){navigate('modules',n.d.id);setTimeout(()=>document.querySelector('#lesson-'+n.i)?.scrollIntoView({behavior:'smooth'}),80)}else navigate('progress')};let back=document.querySelector('#back');if(back)back.onclick=()=>navigate('modules');document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{state.done[b.dataset.lesson]=!state.done[b.dataset.lesson];persist();let y=window.scrollY;render();window.scrollTo(0,y)});document.querySelectorAll('[data-week]').forEach(b=>b.onchange=()=>{state.weeks[b.dataset.week]=b.checked;persist();render()});document.querySelectorAll('[data-note]').forEach(t=>t.oninput=()=>{state.notes[t.dataset.note]=t.value;persist()});let search=document.querySelector('#search');if(search)search.oninput=()=>{state.search=search.value;let rs=RESOURCES.filter(r=>`${r.name} ${r.for} ${r.type} ${r.desc}`.toLowerCase().includes(state.search.toLowerCase()));document.querySelector('#results').innerHTML=rs.map(resourceHtml).join('')||'<div class="empty">没有匹配的资源</div>'};let exp=document.querySelector('#export');if(exp)exp.onclick=()=>{let blob=new Blob([JSON.stringify({schema:1,created:new Date().toISOString(),done:state.done,weeks:state.weeks,notes:state.notes},null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='knowledge-atlas-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};let imp=document.querySelector('#import');if(imp)imp.onchange=async()=>{let f=imp.files?.[0];if(!f)return;if(f.size>2e6){alert('备份文件超过2MB。');return}try{let s=JSON.parse(await f.text());if(s.schema!==1||!s.done||!s.weeks||!s.notes||typeof s.done!=='object'||typeof s.weeks!=='object'||typeof s.notes!=='object')throw Error('格式不正确');if(!confirm('导入将覆盖当前浏览器中的进度和笔记，是否继续？'))return;state.done=s.done;state.weeks=s.weeks;state.notes=s.notes;persist();render();alert('导入成功')}catch(e){alert('导入失败：'+e.message)}};let reset=document.querySelector('#reset');if(reset)reset.onclick=()=>{if(confirm('确认清空当前浏览器中的所有学习记录？此操作不能撤销。')){state.done={};state.weeks={};state.notes={};persist();render()}}}
function render(){let html=({home,map:mapPage,modules:modulePage,plan:planPage,resources:resourcePage,progress:progressPage}[state.view]||home)();document.querySelector('#app').innerHTML=html+`<footer>认知地图 Knowledge Atlas · 2026 · 免费静态学习网站<br>知识卡片是概念性导读，不替代原著或学术参考。外部链接内容由原网站维护。进度仅保存在本机浏览器。</footer>`;bind()}render();
